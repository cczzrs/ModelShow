<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ModelShow · JKRD7 WebGPU 专项验证</title>
    <style>
      :root { color-scheme: dark; font: 15px/1.6 system-ui, sans-serif; background: #101923; color: #d7e6ef; }
      body { max-width: 1100px; margin: 48px auto; padding: 0 24px; }
      h1 { font-size: 24px; margin-bottom: 12px; }
      p { max-width: 850px; color: #a8c0cf; }
      button { font: inherit; border: 1px solid #52728a; border-radius: 6px; padding: 9px 18px; margin: 4px 12px 4px 0; background: #1d3b4e; color: #e0f5ff; cursor: pointer; }
      button:disabled { opacity: .45; cursor: default; }
      #status { display: block; padding: 16px 0; font-weight: 600; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #0b1219; border: 1px solid #294253; border-radius: 8px; padding: 18px; min-height: 200px; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>JKRD7 · WebGPU 专项验证</h1>
    <p>手动运行 67 个中央参考场景，使用实际 WebGPU EX 计算，逐项比较 Python 预期执行记录与最终快照。没有 GPU 时标记 SKIP；任何 JavaScript 回退、计算异常或记录差异都会阻止 PASS。本页仅供本地诊断，不属于生产入口。</p>
    <button id="start" type="button">开始验证</button>
    <button id="stop" type="button" disabled>当前场景结束后中止</button>
    <output id="status" role="status" aria-live="polite">尚未运行</output>
    <pre id="summary" aria-label="验证汇总">点击“开始验证”后运行。</pre>
    <script type="module">import '../tests/jkrd7/browser-gpu.js';</script>
  </body>
</html>
